name: Package Chrome Extension

# Zips chrome-extension/ and attaches it to a GitHub Release whenever a
# version tag is pushed, so installing the extension doesn't require
# cloning the whole repo. Optionally also publishes straight to the Chrome
# Web Store if the repo has been configured with the required secrets/vars
# (see README.md's "Chrome Web Store publishing" section).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    name: Validate manifest version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare manifest.json version to the pushed tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('chrome-extension/manifest.json'))['version'])")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match chrome-extension/manifest.json version ($MANIFEST_VERSION). Bump the manifest version and re-tag."
            exit 1
          fi
          echo "OK: tag matches manifest version $MANIFEST_VERSION"

  package:
    name: Create GitHub Release
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip extension
        run: |
          cd chrome-extension
          zip -r ../obsidian-web-clipper-${{ github.ref_name }}.zip . -x '*.DS_Store'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: obsidian-web-clipper-${{ github.ref_name }}.zip
          generate_release_notes: true

  publish-webstore:
    name: Publish to Chrome Web Store (optional)
    needs: validate-version
    runs-on: ubuntu-latest
    # Skips cleanly when the repo hasn't been configured for Web Store
    # publishing (no CHROME_EXTENSION_ID repository variable set) — this
    # keeps the release usable via plain GitHub Release zips alone.
    if: ${{ vars.CHROME_EXTENSION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Zip extension
        run: |
          cd chrome-extension
          zip -r ../webstore.zip . -x '*.DS_Store'

      - name: Upload & publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: webstore.zip
          extension-id: ${{ vars.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
