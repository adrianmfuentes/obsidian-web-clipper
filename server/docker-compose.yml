version: "3.9"

# ─── Obsidian Web Clipper – Server Stack ──────────────────────────────────────
# Oracle Ampere A1 + Portainer + Nginx Proxy Manager
#
# PORTAINER DEPLOY:
#   Paste this file in Stacks → Add Stack → Web editor.
#   Add AUTH_TOKEN and GEMINI_API_KEY in the "Environment variables" section below.
#
# SSH / CLI DEPLOY:
#   cd server/ && docker compose up -d --build
#   (reads AUTH_TOKEN and GEMINI_API_KEY from your .env file automatically)
#
# NPM: Proxy Host → Forward Hostname: 172.17.0.1  Port: 8088, enable Force SSL.

services:
  clipper-server:
    # Built and published automatically by .github/workflows/docker-publish.yml
    # on every push to master that touches server/** (multi-arch: amd64 + arm64).
    # Just `docker compose pull && docker compose up -d` (or redeploy the stack
    # in Portainer) to pick up a new build — no manual `docker build` needed.
    #
    # Local/offline alternative — build on the server yourself:
    #   cd /opt/obsidian-clipper/server
    #   docker build -t obsidian-clipper-server:latest .
    #   (then change the image line below back to obsidian-clipper-server:latest)
    image: ghcr.io/adrianmfuentes/obsidian-clipper-server:latest

    container_name: obsidian-clipper-server
    restart: unless-stopped

    environment:
      AUTH_TOKEN:     ${AUTH_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL:   ${GEMINI_MODEL:-gemini-2.0-flash}
      DATA_DIR:       ${DATA_DIR:-/app/data}

    ports:
      # Bound on all interfaces – NPM reaches it via 172.17.0.1:8088
      # (172.17.0.1 is the Docker host bridge IP, reachable from any container).
      # Not directly reachable from the internet.
      - "8088:8000"

    volumes:
      - clipper_data:/app/data

    # mem_limit / cpus are compose-native and work in Portainer without Swarm mode.
    # The 'deploy.resources' block requires Swarm and breaks regular stacks.
    mem_limit: 256m
    cpus: 0.5

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 20s

volumes:
  clipper_data:
    driver: local
