version: "3.9"

# ─── Obsidian Web Clipper – Server Stack ──────────────────────────────────────
# Oracle Ampere A1 + Portainer + Nginx Proxy Manager
#
# PORTAINER DEPLOY:
#   Paste this file in Stacks → Add Stack → Web editor.
#   Add AUTH_TOKEN and GEMINI_API_KEY in the "Environment variables" section below.
#
# SSH / CLI DEPLOY:
#   cd server/ && docker compose up -d --build
#   (reads AUTH_TOKEN and GEMINI_API_KEY from your .env file automatically)
#
# NPM: Proxy Host → Forward to 127.0.0.1:8000, enable Force SSL.

services:
  clipper-server:
    build:
      context: .
      dockerfile: Dockerfile
      # No 'platforms' needed – Docker builds natively for the host (ARM64).
      # The 'platforms' key requires BuildKit and breaks Portainer stacks.

    container_name: obsidian-clipper-server
    restart: unless-stopped

    environment:
      AUTH_TOKEN:     ${AUTH_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL:   ${GEMINI_MODEL:-gemini-1.5-flash}
      DATA_DIR:       ${DATA_DIR:-/app/data}

    ports:
      # Bound to localhost only – NPM reaches it via 127.0.0.1:8000.
      # Not directly reachable from the internet.
      - "127.0.0.1:8000:8000"

    volumes:
      - clipper_data:/app/data

    # mem_limit / cpus are compose-native and work in Portainer without Swarm mode.
    # The 'deploy.resources' block requires Swarm and breaks regular stacks.
    mem_limit: 256m
    cpus: 0.5

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 20s

volumes:
  clipper_data:
    driver: local
